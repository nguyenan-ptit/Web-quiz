spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      enabled: false
server:
  port: ${SERVER_PORT}
  error:
    include-message: never
quiz:
  origins: ${QUIZ_ORIGINS}
